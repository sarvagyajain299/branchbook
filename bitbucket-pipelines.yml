# Bitbucket Pipelines for BranchBook
#
# Runs on every pull request and on pushes to develop and main:
#   composer install -> Pint (check only) -> Larastan -> migrate -> Pest
# against a real MySQL 8.0 service container, because later phases depend on
# MySQL-only features (generated columns, window functions).
#
# Validate this file: in Bitbucket open Pipelines -> "Validate" (the online
# bitbucket-pipelines.yml validator), or push it; Bitbucket rejects an invalid
# file before running any step. Locally we only check it is valid YAML.

image: php:8.3-cli

definitions:
  services:
    mysql:
      image: mysql:8.0
      variables:
        MYSQL_DATABASE: testing
        MYSQL_USER: sail
        MYSQL_PASSWORD: password
        MYSQL_ROOT_PASSWORD: password
      memory: 1024

  steps:
    - step: &quality
        name: Lint, static analysis and tests
        size: 2x
        caches:
          - composer
          - node
        services:
          - mysql
        script:
          # System packages and PHP extensions Laravel needs.
          - apt-get update -qq && apt-get install -y -qq git unzip libzip-dev libicu-dev curl > /dev/null
          - docker-php-ext-install -j"$(nproc)" pdo_mysql zip intl bcmath > /dev/null
          - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null && apt-get install -y -qq nodejs > /dev/null
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

          # Dependencies (Composer cache is restored from the "composer" cache above).
          - composer install --no-interaction --prefer-dist --no-progress
          - npm ci && npm run build

          # App config for CI. The MySQL service is reachable on 127.0.0.1.
          - cp .env.example .env
          - php artisan key:generate
          - export DB_HOST=127.0.0.1 DB_DATABASE=testing DB_USERNAME=sail DB_PASSWORD=password

          # Quality gates: fail fast on style, then types, then behaviour.
          - vendor/bin/pint --test
          - vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          - php artisan migrate --force
          - vendor/bin/pest --ci

pipelines:
  pull-requests:
    '**':
      - step: *quality

  branches:
    develop:
      - step: *quality
    main:
      - step: *quality
